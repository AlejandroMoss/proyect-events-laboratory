services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: callbacks
      POSTGRES_USER: ${DB_USERNAME:-callbacks}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - callback-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d callbacks"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  callback-data:
